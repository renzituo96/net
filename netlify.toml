[build]
  command = "npm install"
  publish = "."
  functions = "netlify/functions"

# 重定向规则 - 优先保留函数路径
[[redirects]]
  from = "/.netlify/functions/auth-register-form"
  to = "/.netlify/functions/auth-register-form"
  status = 200
  force = true

[[redirects]]
[[redirects]]
  from = "/.netlify/*"
  to = "/.netlify/:splat"
  status = 200
  force = true

# 其他路径重定向到index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200